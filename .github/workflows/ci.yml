name: ROS 2 CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  cpp-build-and-test:
    name: C++ build and test
    runs-on: ubuntu-24.04

    container:
      image: ros:jazzy-ros-base-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep

          rosdep init 2>/dev/null || true
          rosdep update

          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y

      - name: Build C++ package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash

          colcon build \
            --packages-select amr_cpp_monitor \
            --event-handlers console_direct+

      - name: Test C++ package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash

          colcon test \
            --packages-select amr_cpp_monitor \
            --event-handlers console_direct+

      - name: Show test results
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash

          colcon test-result \
            --all \
            --verbose
